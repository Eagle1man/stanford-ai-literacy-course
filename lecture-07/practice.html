<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Большой тест по курсу</title>
<style>
  :root{
    --navy:#1f3564; --navy2:#2c4a85; --accent:#c0502a; --teal:#0f6b6b;
    --light:#eaeff7; --line:#d5deec; --ink:#1e1e1e; --grey:#6b7280; --white:#fff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:linear-gradient(160deg,#f4f7fc 0%,#e7edf7 100%);
    color:var(--ink); min-height:100vh; display:flex; justify-content:center;
    padding:24px 16px 40px;
  }
  .app{width:100%;max-width:880px}
  header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px}
  .brand{display:flex;flex-direction:column;gap:2px}
  .kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
  h1{font-size:24px;line-height:1.2;margin:4px 0 0;color:var(--navy);font-weight:700}
  .sub{font-size:13px;color:var(--grey);margin-top:4px}
  .stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .pill{background:var(--white);border:1px solid var(--line);border-radius:999px;padding:7px 12px;
    font-size:13px;color:var(--navy);white-space:nowrap;font-weight:600}
  .pill b{color:var(--accent)}
  .pill.warn b{color:var(--accent)}
  .bar{height:8px;background:#dfe6f2;border-radius:999px;overflow:hidden;margin:8px 0 18px}
  .bar>div{height:100%;width:0;background:linear-gradient(90deg,var(--navy),var(--teal));
    border-radius:999px;transition:width .35s ease}
  .card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:22px 22px 18px;
    box-shadow:0 10px 30px rgba(31,53,100,.07);margin-bottom:16px}
  .meta{display:flex;justify-content:space-between;align-items:center;gap:12px;
    font-size:12px;color:var(--grey);margin-bottom:10px}
  .topic{background:var(--light);color:var(--navy);border-radius:999px;padding:4px 10px;font-weight:600}
  .q{font-size:17px;line-height:1.45;font-weight:600;margin:0 0 12px}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
    background:var(--white);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;
    font-size:15px;line-height:1.4;color:var(--ink);cursor:pointer;transition:.15s}
  .opt:hover:not(:disabled){border-color:var(--navy);background:#f7f9fd}
  .opt .key{flex:0 0 24px;height:24px;border-radius:7px;background:var(--light);color:var(--navy);
    font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .opt.picked{border-color:var(--navy);background:#f2f5fc}
  .opt.picked .key{background:var(--navy);color:#fff}
  .opt.correct{border-color:var(--teal);background:#eef7f5}
  .opt.correct .key{background:var(--teal);color:#fff}
  .opt.wrong{border-color:var(--accent);background:#fdf1ec}
  .opt.wrong .key{background:var(--accent);color:#fff}
  .opt:disabled{cursor:default}
  .explain{display:none;margin-top:10px;border-radius:10px;padding:10px 12px;font-size:14px;
    line-height:1.5;background:#f7f9fd;border:1px solid var(--line);color:#33405a}
  .explain.show{display:block;animation:in .2s ease}
  .explain.good{background:#eef7f5;border-color:#bfe0d8}
  .explain.bad{background:#fdf1ec;border-color:#f0c9b8}
  .explain .title{font-weight:700;margin-bottom:4px;color:var(--navy)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px}
  .btn{font:inherit;font-weight:600;font-size:15px;border-radius:11px;padding:11px 18px;cursor:pointer;
    border:1.5px solid transparent;transition:.15s}
  .btn.primary{background:var(--navy);color:#fff}
  .btn.primary:hover{background:var(--navy2)}
  .btn.ghost{background:transparent;color:var(--navy);border-color:var(--line)}
  .btn.ghost:hover{border-color:var(--navy)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .start p{line-height:1.55;font-size:15px;color:#33405a;margin:6px 0 12px}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  .mode{border:1.5px solid var(--line);border-radius:14px;padding:16px;text-align:left;
    background:#fbfcfe;cursor:pointer;font:inherit;transition:.15s}
  .mode:hover{border-color:var(--navy);background:#f5f8fd}
  .mode b{display:block;font-size:16px;color:var(--navy);margin-bottom:6px}
  .mode span{font-size:13px;color:var(--grey);line-height:1.45;display:block}
  .lecbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .lecbar button{font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;
    border:1.5px solid var(--line);background:#fff;color:var(--navy);cursor:pointer}
  .lecbar button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  h2{font-size:19px;color:var(--navy);margin:4px 0 10px}
  table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
  th,td{border:1px solid var(--line);padding:8px 10px;text-align:left}
  th{background:var(--light);color:var(--navy)}
  .result{text-align:center;padding:8px 0 4px}
  .result .big{font-size:52px;font-weight:800;color:var(--navy);line-height:1}
  .result .cap{font-size:14px;color:var(--grey);margin-top:6px}
  .verdict{font-size:16px;line-height:1.5;color:#33405a;margin:12px auto 0;max-width:660px}
  .rev{text-align:left;margin-top:14px}
  .rev ul{margin:4px 0 0;padding-left:18px}
  .rev li{margin-bottom:8px;line-height:1.45}
  a{color:var(--navy2)}
  footer{margin-top:16px;font-size:12px;color:var(--grey);text-align:center;line-height:1.5}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (max-width:640px){
    h1{font-size:20px} .q{font-size:16px} .stats{justify-content:flex-start}
    header{flex-direction:column} .card{padding:18px} .modes{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="kicker">Практика по курсу · лекции 1–6</div>
      <h1>Большой тест по курсу</h1>
      <div class="sub">48 вопросов · 60 минут · разбор ошибок с разбивкой по лекциям</div>
    </div>
    <div class="stats">
      <div class="pill">Отвечено <b id="s-done">0</b>/<span id="s-total">0</span></div>
      <div class="pill">Верно <b id="s-right">0</b></div>
      <div class="pill">Очки <b id="s-score">0</b></div>
      <div class="pill" id="t-pill">Время <b id="s-time">60:00</b></div>
    </div>
  </header>
  <div class="bar"><div id="pbar"></div></div>
  <main id="stage"></main>
  <footer>Часовая самостоятельная практика. Один файл, работает без интернета, прогресс сохраняется в браузере.</footer>
</div>

<script>
var PRACTICE = {"questions": [{"lec": 1, "topic": "Пространство состояний", "q": "Что изображают узлы и стрелки в задаче поиска?", "options": ["Узлы — состояния, стрелки — действия", "Узлы — действия, стрелки — состояния", "Узлы — награды, стрелки — игроки", "Узлы — правила, стрелки — формулы"], "answer": 0, "explain": "Граф поиска: узел — состояние мира, ребро — допустимое действие, которое переводит из одного состояния в другое. По этому графу и ищется путь к цели."}, {"lec": 1, "topic": "Поиск в ширину", "q": "Что гарантирует поиск в ширину (BFS) на невзвешенном графе?", "options": ["Самый дешёвый путь по сумме цен", "Путь с наименьшим числом шагов", "Самый быстрый путь по времени в реальности", "Оптимальный путь при любой эвристике"], "answer": 1, "explain": "BFS раскрывает все узлы на расстоянии k, прежде чем перейти к k+1, поэтому первое нахождение цели даёт минимальное число шагов — но не минимальную цену."}, {"lec": 1, "topic": "A*", "q": "Какое условие делает эвристику A* допустимой?", "options": ["Она всегда равна нулю", "Она никогда не преувеличивает оставшуюся цену", "Она зависит только от числа узлов", "Она равна длине уже пройденного пути"], "answer": 1, "explain": "Допустимая эвристика не завышает оценку до цели. Тогда A* не отбрасывает оптимальный путь и остаётся оптимальным, часто раскрывая меньше узлов, чем UCS."}, {"lec": 1, "topic": "UCS", "q": "По какому принципу выбирает следующий узел UCS?", "options": ["По числу шагов", "По минимальной цене пройденного пути", "По случайному порядку", "По максимуму награды"], "answer": 1, "explain": "UCS (единичная цена поиска) раскрывает узел с минимальной накопленной ценой пути. A* добавляет к этой цене оценку до цели — отсюда и ускорение."}, {"lec": 1, "topic": "MDP", "q": "Что отличает MDP от обычного графа поиска?", "options": ["В MDP нельзя выбрать действие", "В MDP переходы случайны и заданы вероятностями", "В MDP всегда известна цена цели", "В MDP нет состояний"], "answer": 1, "explain": "В графе поиска действие однозначно ведёт в следующий узел. В MDP оно ведёт в разные состояния с разными вероятностями — поэтому оценивается ожидаемый итог."}, {"lec": 1, "topic": "Политика", "q": "Что такое политика в MDP?", "options": ["Таблица всех вероятностей переходов", "Правило «в состоянии S выбрать A»", "Число шагов до цели", "Случайное состояние старта"], "answer": 1, "explain": "Политика — правило выбора действия по состоянию. Ценность политики — ожидаемый дисконтированный итог при следовании этому правилу."}, {"lec": 1, "topic": "Итерация по ценности", "q": "Что делает итерация по ценности?", "options": ["Считает цены всех действий за один шаг", "Пересчитывает оценки из оценок соседей, пока они не стабилизируются", "Удаляет состояния из графа", "Выбирает случайную политику"], "answer": 1, "explain": "Оценки пересчитываются по связке «награда плюс скидка на будущее» до сходимости. Из готовых оценок читается оптимальная политика: берём лучшее действие в каждом состоянии."}, {"lec": 1, "topic": "Дисконт в MDP", "q": "Зачем в MDP нужен дисконт?", "options": ["Чтобы увеличить цену стартового состояния", "Чтобы учесть, что будущие награды ценятся меньше", "Чтобы запретить случайные переходы", "Чтобы сделать число состояний конечным"], "answer": 1, "explain": "Дисконт задаёт скидку на будущее и делает бесконечные цепочки суммируемыми. Без него агент был бы безразличен к тому, когда награда наступит."}, {"lec": 2, "topic": "Bias-variance", "q": "Как выглядит переобучение (high variance)?", "options": ["Ошибка на обучении и проверке одинаково высокая", "Ошибка на обучении низкая, на проверке высокая", "Ошибка на обучении высокая, на проверке низкая", "Модель вообще не обучается"], "answer": 1, "explain": "Переобученная модель запомнила обучающую выборку: train-ошибка низкая, а на новых данных ошибка большая. Лечат больше данных, регуляризацией, ансамблями."}, {"lec": 2, "topic": "Выборки", "q": "Для чего нужна контрольная (validation) выборка?", "options": ["Для финальной оценки перед выпуском", "Для настройки гиперпараметров без использования тестовой выборки", "Для увеличения объёма обучающей выборки", "Для проверки, что данные не испорчены"], "answer": 1, "explain": "Validation-выборка используется во время разработки для выбора гиперпараметров. Тестовая выборка хранится до конца и вскрывается один раз — иначе оценка будет завышена."}, {"lec": 2, "topic": "Backprop", "q": "Что возвращает обратное распространение ошибки?", "options": ["Новые веса сразу", "Градиент функции потерь по каждому весу", "Список ошибок классификации", "Оптимальную архитектуру сети"], "answer": 1, "explain": "Backprop считает производные функции потерь по параметрам. Веса обновляются отдельным шагом оптимизации: вес минус скорость умножить на градиент."}, {"lec": 2, "topic": "Метрики", "q": "Почему accuracy плохо работает при сильном дисбалансе классов?", "options": ["Потому что она всегда равна нулю", "Потому что модель может угадывать большинство классов и выглядеть отлично", "Потому что её нельзя посчитать числом", "Потому что она зависит только от размера выборки"], "answer": 1, "explain": "Если 99% примеров одного класса, модель, всегда предсказывающая его, даёт accuracy 99%, не решая задачу. Смотрят precision, recall, PR-AUC и цену ошибки."}, {"lec": 2, "topic": "Байес", "q": "Как обновляется убеждение по Байесу?", "options": ["Априорное убеждение умножается на правдоподобие данных и нормируется", "Априорное убеждение заменяется новыми данными полностью", "Убеждение делится на число признаков", "Убеждение не меняется"], "answer": 0, "explain": "Апостериорное убеждение пропорционально правдоподобию, умноженному на априорное. Данные не отменяют прежнее знание, а сдвигают его — это и есть формула Байеса."}, {"lec": 2, "topic": "Регуляризация", "q": "Что делает регуляризация (например, штраф за большие веса)?", "options": ["Увеличивает ошибку на обучении и снижает риск переобучения", "Всегда улучшает результат на всех данных", "Увеличивает число параметров", "Заменяет функцию потерь на accuracy"], "answer": 0, "explain": "Регуляризация ограничивает сложность модели: train-ошибка может вырасти, но разрыв с проверочной ошибкой обычно уменьшается — снижается variance."}, {"lec": 2, "topic": "Гиббс", "q": "Что делает метод Гиббса в байесовских сетях?", "options": ["Находит точный ответ перебором всех миров", "Приближает распределение, последовательно пересчитывая переменные", "Обучает нейросеть градиентом", "Удаляет переменные из сети"], "answer": 1, "explain": "Гиббсовская выборка — приближённый вывод: переменные обновляются по своим условным распределениям, и после большого числа шагов выборка приближает нужное распределение."}, {"lec": 2, "topic": "Тест и утечка", "q": "Что такое утечка данных (data leakage)?", "options": ["Информация из тестовой выборки попала в обучение", "Данные слишком большие", "Модель не сошлась", "Выборка содержит пропуски"], "answer": 0, "explain": "Утечка — любое попадание информации о будущем или о тесте в обучение. Например, если нормализацию считают по всей выборке сразу, оценка становится нечестной."}, {"lec": 3, "topic": "Внимание", "q": "Что считает self-attention?", "options": ["Вероятность того, что токен надо удалить", "Степень соответствия токенов друг другу внутри одного текста", "Градиент функции потерь", "Число слов в предложении"], "answer": 1, "explain": "Self-attention для каждого токена смотрит на остальные и определяет, какие из них важны для его представления — так учитывается контекст."}, {"lec": 3, "topic": "Multi-head", "q": "Зачем несколько голов внимания (multi-head)?", "options": ["Чтобы увеличить размер словаря", "Чтобы параллельно отслеживать разные виды связей", "Чтобы снизить число параметров", "Чтобы отключить позиционное кодирование"], "answer": 1, "explain": "Разные головы учатся разным отношениям: синтаксическим, смысловым, позиционным. Они работают параллельно, а их результаты объединяются."}, {"lec": 3, "topic": "Контекст", "q": "Почему длинный контекст дорог для трансформера?", "options": ["Потому что растёт число токенов в словаре", "Потому что стоимость внимания растёт примерно как квадрат длины", "Потому что нельзя использовать кэш", "Потому что модель забывает первые слова"], "answer": 1, "explain": "Каждый токен сравнивается со всеми остальными, поэтому число пар растёт как n². Отсюда ограничение контекстного окна и интерес к методам вроде FlashAttention."}, {"lec": 3, "topic": "Архитектуры", "q": "Чем BERT отличается от GPT по способу чтения текста?", "options": ["BERT видит оба направления, GPT — только предыдущие токены", "BERT не использует внимание, GPT использует", "BERT генеративный, GPT — только классификатор", "Разницы нет"], "answer": 0, "explain": "BERT — encoder с двусторонним контекстом, хорошо подходит для понимания текста. GPT — decoder с причинно-следственной маской: при генерации токен видит только прошлое."}, {"lec": 3, "topic": "Дообучение", "q": "Что делает SFT (обучение с настройкой на инструкции)?", "options": ["Учит модель отвечать на новые языки", "Учит модель следовать инструкциям на примерах хороших ответов", "Заменяет токенизацию", "Увеличивает контекст до бесконечности"], "answer": 1, "explain": "Предварительное обучение учит предсказывать следующий токен; SFT на примерах «инструкция — хороший ответ» учит выполнять просьбы пользователя в нужной форме."}, {"lec": 3, "topic": "RLHF", "q": "Откуда берётся награда в RLHF?", "options": ["Из готовой разметки классов", "Из модели, обученной на сравнениях ответов людьми", "Из длины ответа", "Из числа параметров модели"], "answer": 1, "explain": "Люди сравнивают пары ответов; по их выбору обучается модель награды. Она и служит численной целью при RL-дообучении модели."}, {"lec": 3, "topic": "Объяснимость", "q": "Почему карту внимания нельзя считать объяснением ответа?", "options": ["Потому что она слишком красивая", "Потому что она показывает веса, а не причинное влияние на ответ", "Потому что её нельзя нарисовать", "Потому что внимание не используется в трансформерах"], "answer": 1, "explain": "Веса внимания показывают, на что модель смотрела, но не доказывают, что именно это определило ответ. Работа Jain & Wallace и др. показывает разрыв между визуализацией и объяснением."}, {"lec": 3, "topic": "Окно контекста", "q": "Что происходит, когда текст длиннее контекстного окна?", "options": ["Модель автоматически прочитает всё целиком", "Часть текста придётся обрезать или обработать по частям", "Модель перестанет выдавать ответ", "Размер модели уменьшится"], "answer": 1, "explain": "Контекстное окно — жёсткий лимит числа токенов. Длинные документы режут на части, а для работы с ними используют поиск по фрагментам — тема следующего продолжения курса."}, {"lec": 4, "topic": "Minimax", "q": "Какое предположение о противнике делает minimax?", "options": ["Противник действует случайно", "Противник всегда минимизирует нашу оценку", "Противник ошибается в половине случаев", "Противника нет"], "answer": 1, "explain": "Minimax — пессимистичная стратегия: мы максимизируем исход, считая, что соперник в своём узле выберет для нас наихудший вариант."}, {"lec": 4, "topic": "Expectimax", "q": "Чем expectimax отличается от minimax?", "options": ["Вместо minimax-узла стоит узел случайности со средним по вероятностям", "В нём нет листьев", "В нём всегда два игрока", "В нём не нужна оценочная функция"], "answer": 0, "explain": "В узле случайности expectimax берёт не минимум, а средневзвешенное значение по вероятностям исходов — это модель не враждебной, а случайной среды."}, {"lec": 4, "topic": "Альфа-бета", "q": "Почему альфа-бета отсечение не меняет итог?", "options": ["Потому что оно пропускает только равные варианты", "Потому что отсечённая ветка заведомо не влияет на решение предка", "Потому что оно знает все листья заранее", "Потому что противник играет случайно"], "answer": 1, "explain": "Отсечение происходит, когда у предка уже есть вариант не хуже: ни мы, ни соперник не выберем отсечённую ветку. Результат тот же, раскрытых узлов меньше."}, {"lec": 4, "topic": "Оценка позиции", "q": "Зачем нужна оценочная функция, если дерево можно досчитать до конца?", "options": ["Чтобы заменить минимакс на случайный поиск", "Чтобы приблизить листья на ограниченной глубине", "Чтобы увеличить число игроков", "Чтобы убрать правила игры"], "answer": 1, "explain": "Полное дерево слишком велико. Поиск обрывается на глубине k, а листья получают оценку позиции — приближение будущего исхода."}, {"lec": 4, "topic": "TD-обучение", "q": "Как TD-обучение улучшает оценку позиции в самоигре?", "options": ["Считает оценку по итогам случайного старта", "Подтягивает оценку текущей позиции к оценке следующей", "Заменяет игру таблицей истинности", "Удаляет проигрышные ходы из правил"], "answer": 1, "explain": "TD-обучение обновляет оценку после каждого хода: текущая оценка сдвигается к награде плюс оценка следующей позиции. Со временем оценки становятся точнее."}, {"lec": 4, "topic": "Одновременные игры", "q": "Что изображает таблица выигрышей в одновременно игре?", "options": ["Исход для каждой пары стратегий игроков", "Только ходы первого игрока", "Вероятности случайных событий", "Глубину дерева"], "answer": 0, "explain": "В одновременно игре ходы делаются без знания выбора соперника: каждая клетка таблицы — исход для пары действий, и игроки выбирают стратегии над этими действиями."}, {"lec": 4, "topic": "Равновесие Нэша", "q": "Что означает равновесие Нэша?", "options": ["Оба игрока выигрывают поровну", "Ни одному игроку не выгодно изменить стратегию в одиночку", "Игра всегда заканчивается ничьей", "Один игрок всегда побеждает"], "answer": 1, "explain": "Равновесие — ситуация, в которой отклонение одного игрока при неизменной стратегии другого не улучшает его результат. Оно не обязательно лучшее для обоих."}, {"lec": 4, "topic": "Смешанные стратегии", "q": "Зачем в игре нужны смешанные стратегии?", "options": ["Чтобы ускорить расчёт дерева", "Чтобы быть непредсказуемым: чистую стратегию можно эксплуатировать", "Чтобы сократить число ходов", "Чтобы убрать случайность из игры"], "answer": 1, "explain": "Если вы всегда ходите одинаково, соперник это выучит и накажет. Смешивание действ с заданными вероятностями делает стратегию устойчивее к эксплуатации."}, {"lec": 5, "topic": "Синтаксис и семантика", "q": "За что отвечает синтаксис в логике?", "options": ["За то, какие формулы допустимы", "За то, истина формула или нет", "За число возможных миров", "За скорость вывода"], "answer": 0, "explain": "Синтаксис задаёт правила записи; семантика придаёт записанному смысл. Формула может быть корректно записана, но быть ложной в конкретном мире."}, {"lec": 5, "topic": "Модель", "q": "Что такое модель в пропозициональной логике?", "options": ["Обученная функция предсказания", "Назначение истинности всем символам — возможный мир", "Набор правил вывода", "Формула, верная всегда"], "answer": 1, "explain": "Модель — это законченный возможный мир: для каждого символа указано, истина он или ложь. Формула получает значение только вместе с моделью."}, {"lec": 5, "topic": "Выводимость", "q": "Что значит, что база знаний выводит утверждение Q?", "options": ["Q есть в базе дословно", "Q истина во всех моделях базы", "Q вероятнее остальных", "Q можно записать тем же шрифтом"], "answer": 1, "explain": "Выводимость означает: в каждом мире, совместимом с базой, Q верно. Добавление Q к базе тогда не сужает набор моделей."}, {"lec": 5, "topic": "Ask/Tell", "q": "Какой ответ даёт Ask, если новое утверждение противоречит базе?", "options": ["«Да»", "«Не знаю»", "«Нет»", "«Перезапустить»"], "answer": 2, "explain": "Три ответа: «да» — выводится, «нет» — противоречит, «не знаю» — контингентно. «Не знаю» — полноценный результат, а не сбой."}, {"lec": 5, "topic": "Modus ponens", "q": "Какое правило записано как «из P и если P, то Q — следует Q»?", "options": ["Дедукция по Попперу", "Modus ponens", "Закон исключённого третьего", "Теорема Байеса"], "answer": 1, "explain": "Modus ponens — базовое правило вывода: если посылка и импликация верны, верно следствие. Оно работает с формой записи, а не с перебором смыслов."}, {"lec": 5, "topic": "Кванторы", "q": "Как правильно записать «все студенты знают арифметику»?", "options": ["«Студент и знает» bez квантора", "«Для любого x: если x — студент, то x знает арифметику»", "«Существует x: студент и знает»", "«Студент или знает»"], "answer": 1, "explain": "«Все» почти всегда идёт с импликацией под квантором «для любого». Конъюнкция под «для любого» означала бы, что вообще все объекты — студенты."}, {"lec": 5, "topic": "Унификация", "q": "Что делает унификация?", "options": ["Проверяет, верна ли формула во всех мирах", "Находит подстановку, делающую две записи одинаковыми", "Считает число моделей", "Удаляет кванторы"], "answer": 1, "explain": "Унификация подбирает значения переменных так, чтобы шаблон правила совпал с фактом. Благодаря ей одно правило применяется ко многим объектам."}, {"lec": 5, "topic": "Сходимость и полнота", "q": "Чем сходимость (soundness) отличается от полноты?", "options": ["Сходимость — всё доказанное истинно; полнота — всё истинное доказуемо", "Это одно и то же", "Сходимость про скорость, полнота про память", "Сходимость про число правил, полнота про число формул"], "answer": 0, "explain": "Сходимость запрещает выдавать ложное, полнота требует уметь вывести любое истинное из базы. Запомните пару: «ничего кроме правды» и «вся правда»."}, {"lec": 6, "topic": "Постановка", "q": "Чем обучение с подкреплением отличается от обучения с учителем?", "options": ["Метка заменяется числом, остальное то же", "Правильного ответа нет: награда приходит после действия", "В нём нельзя строить таблицы", "В нём всегда есть разметка"], "answer": 1, "explain": "Учитель даёт эталон до попытки. Здесь эталона нет, есть последствие; данные зависят от действий агента, а цель — суммарный итог."}, {"lec": 6, "topic": "Дисконт", "q": "Что происходит, если вероятность исследования ε равна нулю?", "options": ["Агент найдёт лучшую стратегию быстрее", "Агент перестанет пробовать новое и может застрять", "Оценки станут точнее без данных", "Награда перестанет приходить"], "answer": 1, "explain": "Без случайных действий оценки в непосещённых состояниях не обновляются. Исследование — плата за знание; полностью убрав её, агент рискует застрять."}, {"lec": 6, "topic": "Q-learning", "q": "Что служит ориентиром при обновлении Q-оценки после шага?", "options": ["Только итог в конце эпизода", "Награда за шаг плюс лучшая оценка продолжения", "Число посещений состояния", "Оценка куратора"], "answer": 1, "explain": "Q-learning обновляет ячейку сразу, беря награду за шаг и собственную лучшую оценку будущего — это подхлёстывание. Ожидание полного итога — метод Монте-Карло."}, {"lec": 6, "topic": "ε-greedy", "q": "При ε = 0,2 какую долю действий агент выполнит наугад?", "options": ["2%", "20%", "80%", "0%"], "answer": 1, "explain": "ε — это вероятность случайного действия: 0,2 = 20% попыток. Остальные 80% приходятся на лучшее известное действие; со временем ε обычно уменьшают."}, {"lec": 6, "topic": "Модель среды", "q": "Что означает «обучаться без модели среды»?", "options": ["Агент не знает состояние", "Агент не получает награду", "Агент не оценивает вероятности переходов, а учится на фактических переходах", "Среда не меняется"], "answer": 2, "explain": "Модель среды — описание вероятностей переходов и наград. Model-free алгоритм обновляет оценки по фактически увиденным переходам, не строя такое описание."}, {"lec": 6, "topic": "Reward hacking", "q": "В чём причина обмана награды (reward hacking)?", "options": ["Ошибка в коде", "Слишком большая модель", "Разрыв между замыслом и формальной формулой награды", "Отсутствие разметки"], "answer": 2, "explain": "Агент честно максимизирует записанную формулу, а не замысел постановщика. Это свойство любой конечной цели, а не баг: лечится проектированием награды и проверками на обман."}, {"lec": 6, "topic": "Policy gradient", "q": "Что делает policy gradient?", "options": ["Заполняет таблицу всех пар «состояние — действие»", "Правит вероятности действий политики в сторону удачных попыток", "Удаляет непосещённые состояния", "Запрещает случайные действия"], "answer": 1, "explain": "Вместо оценки каждой пары метод сдвигает само правило: действия из прогонов с большим итогом становятся вероятнее, с малым — реже. Это алгоритм REINFORCE."}, {"lec": 6, "topic": "RLHF", "q": "Как устроен конвейер выравнивания RLHF?", "options": ["Разметка классов → классификатор → отчёт", "Ответы → выбор куратора → модель награды → обучение с подкреплением", "Поиск → оценка позиции → минимакс", "База знаний → поиск → генерация"], "answer": 1, "explain": "Модель выдаёт пары ответов, человек выбирает лучший, по выборам обучается модель награды, и она становится целью RL-дообучения. Готовых ответов нет — есть предпочтения."}], "minutes": 60};

<script>
(function(){

  var graded = new Array(total).fill(false);

  var stage = document.getElementById("stage");
  var STORE = "cs221-practice-answers";
  document.getElementById("s-total").textContent = total;

  function el(tag, cls, text){

    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }
  function fmt(sec){
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }
  function refresh(){
    var done = picked.filter(function(x){ return x !== null; }).length;
    document.getElementById("s-done").textContent = done;

    document.getElementById("s-score").textContent = score;
    document.getElementById("pbar").style.width = Math.round(done / total * 100) + "%";
  }
  function save(){ if (!SELFTEST){ try { localStorage.setItem(STORE, JSON.stringify(picked)); } catch(e){} } }
  function startTimer(){

      remaining = Math.max(0, Math.round((deadline - Date.now()) / 1000));
      document.getElementById("s-time").textContent = fmt(remaining);
      if (remaining <= 300) document.getElementById("t-pill").classList.add("warn");
      if (remaining === 0) finish();
    }, 500);
  }
  function stopTimer(){ if (timer){ clearInterval(timer); timer = null; } }

  function buildStart(){
    stage.textContent = "";
    var c = el("div", "card start");

      + "Ответы сохраняются в браузере: если страницу обновить, прогресс не пропадёт. "
      + "Выберите режим ниже. В обоих режимах после завершения покажется разбор каждой ошибки."));
    var modes = el("div", "modes");

    exam.appendChild(el("b", null, "Большой тест — 60 минут"));
    exam.appendChild(el("span", null, "Все " + total + " вопросов подряд, без подсказок. Таймер считает назад; "
      + "по истечении времени тест завершится сам. Можно оставить студентов работать самостоятельно."));
    exam.addEventListener("click", function(){ begin("exam"); });
    var train = el("button", "mode");
    train.type = "button";
    train.appendChild(el("b", null, "Тренировка — без таймера"));
    train.appendChild(el("span", null, "Фильтр по лекции 1–6; после каждого ответа сразу видно, "
      + "где ошибка и почему. Удобно готовиться и разбирать провалы."));
    train.addEventListener("click", function(){ begin("train"); });
    modes.appendChild(exam); modes.appendChild(train);
    c.appendChild(modes);
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(STORE) || "null"); } catch(e){}
    if (saved && saved.length === total && saved.some(function(x){ return x !== null; })){
      var r = el("div", "row");
      r.style.marginTop = "14px";
      var b = el("button", "btn ghost", "Восстановить " + saved.filter(function(x){return x!==null;}).length + " сохранённых ответов");
      b.type = "button";
      b.addEventListener("click", function(){
        picked = saved;
        refresh();
        b.disabled = true;
      });
      r.appendChild(b);
      c.appendChild(r);
    }
    stage.appendChild(c);
  }

  function begin(m){
    mode = m;
    document.getElementById("t-pill").style.display = m === "exam" ? "" : "none";
    if (m === "exam") startTimer();
    build();
  }

  function build(){
    stage.textContent = "";
    if (filter){
      var bar = el("div", "lecbar");
      [[0,"Все лекции"],[1,"Лекция 1"],[2,"Лекция 2"],[3,"Лекция 3"],
       [4,"Лекция 4"],[5,"Лекция 5"],[6,"Лекция 6"]].forEach(function(p){
        var b = el("button", filter === p[0] ? "on" : "", p[1]);
        b.type = "button";
        b.addEventListener("click", function(){ filter = p[0]; build(); });
        bar.appendChild(b);
      });
      stage.appendChild(bar);
    }
    qs.forEach(function(q, i){
      if (filter && q.lec !== filter) return;
      var card = el("div", "card");
      var meta = el("div", "meta");
      meta.appendChild(el("span", "topic", "Лекция " + q.lec + " · " + q.topic));
      meta.appendChild(el("span", null, "Вопрос " + (i + 1) + " из " + total));
      card.appendChild(meta);
      card.appendChild(el("p", "q", q.q));
      var opts = el("div", "opts");
      q.options.forEach(function(text, k){
        var b = el("button", "opt");
        b.type = "button";
        b.appendChild(el("span", "key", String.fromCharCode(1040 + k)));
        b.appendChild(el("span", null, text));
        if (picked[i] === k) b.classList.add("picked");
        if (graded[i]) b.disabled = true;
        b.addEventListener("click", function(){ answer(i, k); });
        opts.appendChild(b);
      });
      card.appendChild(opts);
      var ex = el("div", "explain");
      if (graded[i]) revealInto(ex, i);
      card.appendChild(ex);
      cards[i] = card;
      stage.appendChild(card);
    });
    var row = el("div", "row");
    row.style.justifyContent = "center";
    if (mode === "exam"){
      var fin = el("button", "btn primary", "Завершить тест и проверить");
      fin.type = "button";
      fin.addEventListener("click", finish);
      row.appendChild(fin);
    } else {
      var chk = el("button", "btn primary", "Проверить всё и показать результат");
      chk.type = "button";
      chk.addEventListener("click", finish);
      row.appendChild(chk);
    }
    var reset = el("button", "btn ghost", "Начать заново");
    reset.type = "button";
    reset.addEventListener("click", resetAll);
    row.appendChild(reset);
    stage.appendChild(row);
  }

  function answer(i, k){
    if (graded[i] || finished) return;
    picked[i] = k;
    var opts = cards[i].querySelectorAll(".opt");
    opts.forEach(function(x){ x.classList.remove("picked"); });
    opts[k].classList.add("picked");
    if (mode === "train") gradeOne(i);
    save();
    refresh();
  }
  function revealInto(ex, i){
    var ok = picked[i] === qs[i].answer;
    var opts = cards[i].querySelectorAll(".opt");
    opts.forEach(function(b, k){
      b.disabled = true;
      if (k === qs[i].answer) b.classList.add("correct");
      else if (k === picked[i]) b.classList.add("wrong");
    });
    ex.classList.add("show", ok ? "good" : "bad");
    ex.appendChild(el("div", "title", ok ? "Верно" : "Неверно — правильный ответ: " + qs[i].options[qs[i].answer]));
    ex.appendChild(el("div", null, qs[i].explain));
    var link = el("a", null, "Открыть слайды лекции " + qs[i].lec);
    link.href = "../lecture-0" + qs[i].lec + "/presentation.pdf";
    link.style.display = "block";
    link.style.marginTop = "6px";
    ex.appendChild(link);
  }
  function gradeOne(i){
    if (graded[i] || picked[i] === null) return;
    graded[i] = true;
    if (picked[i] === qs[i].answer){ right += 1; score += 100; }
    if (cards[i]) revealInto(cards[i].querySelector(".explain"), i);
  }
  function finish(){
    if (finished) return;
    finished = true;
    stopTimer();
    for (var i = 0; i < total; i++) gradeOne(i);
    refresh();
    renderResult();
  }
  function renderResult(){
    stage.textContent = "";
    var acc = Math.round(right / total * 100);
    var card = el("div", "card result");
    card.appendChild(el("div", "big", right + " / " + total));
    card.appendChild(el("div", "cap", "верных ответов · " + score + " очков · " + acc + "% · "
      + (mode === "exam" ? "затрачено " + fmt((PRACTICE.minutes||60)*60 - remaining) : "без таймера")));
    var verdict = acc >= 85
      ? "Отличный результат: материал шести лекций усвоен уверенно."
      : (acc >= 60
        ? "Основа есть, но по нескольким лекциям остались провалы — разберите их ниже до занятия."
        : "Пока рано идти дальше: вернитесь к конспектам и схемам по темам из списка ниже.");
    card.appendChild(el("div", "verdict", verdict));

    var byLec = [];
    for (var l = 1; l <= 6; l++){
      var okL = 0, allL = 0;
      for (var j = 0; j < total; j++){
        if (qs[j].lec === l){ allL += 1; if (picked[j] === qs[j].answer) okL += 1; }
      }
      byLec.push([l, okL, allL]);
    }
    var wrap = el("div", "rev");
    wrap.appendChild(el("h2", null, "Результат по лекциям"));
    var tbl = el("table");
    var tr = el("tr");
    tr.appendChild(el("th", null, "Лекция"));
    tr.appendChild(el("th", null, "Верно"));
    tr.appendChild(el("th", null, "Что посмотреть"));
    tbl.appendChild(tr);
    byLec.forEach(function(row){
      var r = el("tr");
      r.appendChild(el("td", null, "Лекция " + row[0]));
      r.appendChild(el("td", null, row[1] + " из " + row[2]));
      var td = el("td");
      if (row[1] < row[2]){
        var a = el("a", null, "слайды и конспект");
        a.href = "../lecture-0" + row[0] + "/presentation.pdf";
        td.appendChild(a);
      } else {
        td.textContent = "всё верно";
      }
      r.appendChild(td);
      tbl.appendChild(r);
    });
    wrap.appendChild(tbl);

    var wrong = [];
    for (var i2 = 0; i2 < total; i2++){
      if (picked[i2] !== qs[i2].answer) wrong.push(i2);
    }
    wrap.appendChild(el("h2", null, wrong.length ? "Разбор ошибок" : "Ошибок нет"));
    if (wrong.length){
      var ul = el("ul");
      wrong.forEach(function(i3){
        var li = el("li");
        li.appendChild(el("span", "topic", "Лекция " + qs[i3].lec + " · " + qs[i3].topic));
        li.appendChild(document.createTextNode(" " + qs[i3].q));
        var ex = el("div", "explain show bad");
        ex.appendChild(el("div", "title", "Правильный ответ: " + qs[i3].options[qs[i3].answer]));
        ex.appendChild(el("div", null, qs[i3].explain));
        li.appendChild(ex);
        ul.appendChild(li);
      });
      wrap.appendChild(ul);
    } else {
      wrap.appendChild(el("p", null, "Все ответы верны. Можно повторить тест ещё раз — вопросы останутся теми же, "
        + "но ошибки покажут, что действительно не усвоено."));
    }
    card.appendChild(wrap);
    var row = el("div", "row");
    row.style.justifyContent = "center";
    var again = el("button", "btn primary", "Пройти заново");
    again.type = "button";
    again.addEventListener("click", resetAll);
    row.appendChild(again);
    card.appendChild(row);
    stage.appendChild(card);
  }
  function resetAll(){
    picked = new Array(total).fill(null);
    graded = new Array(total).fill(false);
    cards = new Array(total).fill(null);
    right = 0; score = 0; finished = false;
    remaining = (PRACTICE.minutes || 60) * 60;
    stopTimer();
    try { localStorage.removeItem(STORE); } catch(e){}
    document.getElementById("s-time").textContent = fmt(remaining);
    document.getElementById("t-pill").classList.remove("warn");
    refresh();
    buildStart();
  }

  document.getElementById("s-time").textContent = fmt(remaining);
  if (SELFTEST){
    mode = "exam";
    document.getElementById("t-pill").style.display = "none";
    build();
    var step = 0;
    function tick(){
      if (step < total){
        cards[step].querySelectorAll(".opt")[qs[step].answer].click();
        step += 1;
        setTimeout(tick, 8);
        return;
      }
      finish();
      var out = document.createElement("div");
      out.id = "selftest-result";
      out.textContent = "SELFTEST score=" + score + " correct=" + right +
                        " total=" + total + " answered=" +
                        picked.filter(function(x){ return x !== null; }).length;
      document.body.appendChild(out);
    }
    setTimeout(tick, 30);
  } else {
    buildStart();
  }
  refresh();
})();
</script>
</body>
</html>
