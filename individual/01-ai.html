<style>
:root{--navy:#1f3564;--accent:#c0502a;--teal:#0f6b6b;--line:#d5deec;--light:#eaeff7;--grey:#6b7280;--ink:#1e1e1e}
*{box-sizing:border-box}html,body{margin:0;padding:0;height:100%}
body{font-family:"Segoe UI",Roboto,Arial,sans-serif;background:#f4f7fc;color:var(--ink);height:100vh;display:flex;flex-direction:column}

.chk{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:8px;cursor:pointer}

@media(max-width:820px){body{height:auto;overflow:auto}main{grid-template-columns:1fr}.col{overflow:visible;min-height:auto}.col-left{border-right:0;border-bottom:1px solid var(--line)}}
</style></head>
