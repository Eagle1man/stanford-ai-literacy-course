<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Проект 2. Выбор стратегии</title>
<style>
:root{--navy:#1f3564;--accent:#c0502a;--teal:#0f6b6b;--line:#d5deec;--light:#eaeff7;--grey:#6b7280;--ink:#1e1e1e}
*{box-sizing:border-box}html,body{margin:0;padding:0;height:100%}
body{font-family:"Segoe UI",Roboto,Arial,sans-serif;background:#f4f7fc;color:var(--ink);height:100vh;display:flex;flex-direction:column}
header{background:linear-gradient(120deg,var(--navy),#2c4a85);color:#fff;padding:11px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:19px;margin:0}header .sub{font-size:12px;opacity:.85;margin-top:3px}
.kicker{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#ffd9c9;font-weight:700}
.pills span{background:rgba(255,255,255,.15);border-radius:999px;padding:5px 10px;font-size:12px;margin-left:5px}
.qr{display:flex;align-items:center;gap:8px;font-size:11px;color:#fff}
.qr img{width:46px;height:46px;background:#fff;border-radius:6px}
main{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
.col{padding:15px 17px;overflow-y:auto;min-height:0}
.col-left{background:#fff;border-right:1px solid var(--line)}.col-right{background:#fbfcfe}
.col h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--grey);margin:0 0 10px}
.stage{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin-bottom:10px}
.stage.done{opacity:.6}
.stage h3{font-size:15px;color:var(--navy);margin:0 0 5px;display:flex;justify-content:space-between;gap:8px}
.stage h3 span{font-size:12px;color:var(--accent);white-space:nowrap}
.stage p{margin:4px 0;font-size:13px;line-height:1.45}
.step{background:#f7f9fd;border-radius:8px;padding:7px 9px;font-size:12.5px;line-height:1.45;margin-top:6px}
.eg{background:#eef7f5;border-left:3px solid var(--teal);border-radius:7px;padding:7px 9px;font-size:12px;margin-top:6px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:8px;cursor:pointer}
.qcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 8px 22px rgba(31,53,100,.07)}
.qmeta{font-size:12px;color:var(--grey);display:flex;justify-content:space-between;margin-bottom:7px}
.qtext{font-size:16px;font-weight:700;line-height:1.4;margin:0 0 12px}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13.5px;line-height:1.4;cursor:pointer;display:flex;gap:10px}
.opt:hover{border-color:var(--navy)}.opt .key{flex:0 0 21px;height:21px;border-radius:6px;background:var(--light);color:var(--navy);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.opt.sel{border-color:var(--navy);background:#f2f5fc}.opt.sel .key{background:var(--navy);color:#fff}
.bar{height:7px;background:#dfe6f2;border-radius:999px;overflow:hidden;margin:7px 0 10px}
.bar>div{height:100%;width:0;background:linear-gradient(90deg,var(--navy),var(--teal));border-radius:999px;transition:width .25s}
.row{display:flex;gap:8px;align-items:center;margin-top:10px}
.btn{font:inherit;font-weight:700;font-size:13px;border-radius:10px;padding:9px 13px;cursor:pointer;border:1.5px solid transparent}
.btn.primary{background:var(--navy);color:#fff}.btn:disabled{opacity:.4;cursor:not-allowed}
.res .big{font-size:38px;font-weight:800;color:var(--navy)}
.rev li{margin-bottom:9px;font-size:12.5px;line-height:1.4}.ex2{background:#fdf1ec;border-radius:7px;padding:6px 8px;font-size:12px;margin-top:3px}
@media(max-width:820px){body{height:auto;overflow:auto}main{grid-template-columns:1fr}.col{overflow:visible;min-height:auto}.col-left{border-right:0;border-bottom:1px solid var(--line)}}
</style></head>

<script>var DATA={"steps": [["Цель и результат", 9, "Сделайте лист «Алгоритм выбора хода» — коротко и по шагам.", "Запишите цель: как выбрать ход, когда есть противник и неизвестность.", "Пример: «Выбираю ход: смотрю на худший ответ, затем на случайность»."], ["Опишите игру", 9, "Возьмите простую игру: крестики-нолики или торги.", "Запишите: игроки, доступные ходы, как заканчивается игра, что считается выигрышем.", "Пример: два игрока, ходы — клетки, победа — три в ряд."], ["Дерево из трёх ходов", 9, "Нарисуйте дерево: ваш ход, ответ противника, ваш следующий ход.", "Обозначьте узлы буквами, а стрелки — действиями. Отметьте концы партии.", "Пример: корень — пустое поле, стрелки — ходы в центр и угол."], ["MAX и MIN", 9, "В своих узлах берите лучший исход, в узлах противника — худший.", "Подпишите над узлами: MAX или MIN. Запишите итоговую оценку корня.", "Пример: защита от худшего ответа — и есть минимакс."], ["Добавляем случайность", 9, "Представьте, что ход определяет бросок кубика.", "Для трёх исходов с вероятностями посчитайте среднее и сравните с пессимизмом.", "Пример: 10, 20 и 30 с равными шансами дают в среднем 20."], ["Отсечение ветки", 9, "Найдите ветку, которую можно не рассматривать.", "Объясните одним предложением, почему она не влияет на выбор.", "Пример: если уже есть гарантированный выигрыш, проигрышную ветку можно пропустить."], ["Оценка позиции", 9, "Представьте дерево из миллиона позиций.", "Запишите, что делать: ограничить глубину и оценить листья по признакам.", "Пример: в шахматах оценивают фигуры и безопасность короля, а не всю партию до конца."], ["Одновременный ход", 9, "Постройте таблицу для игры «камень — ножницы — бумага».", "Строки — ваши ходы, столбцы — ход противника, клетки — результат.", "Пример: камень против ножниц — выигрыш; камень против бумаги — проигрыш."], ["Смешанная стратегия", 9, "Объясните, почему нельзя всегда ходить одинаково.", "Запишите: выбор действия с вероятностями делает вас непредсказуемым.", "Пример: если вы всегда «камень», противник ответит «бумага»."], ["Сдача и проверка", 9, "Сдайте лист и пройдите проверку справа — 80 вопросов.", "Прочитайте разбор ошибок и отметьте шаг алгоритма, который нужно уточнить.", "Пример: ошибка в Questions про отсечение — перечитайте шаг про ветки."]], "questions": [{"q": "Что главное отличает такую игру от обычной задачи поиска пути?", "opts": ["В игре всегда больше состояний", "После вашего хода действует соперник с неизвестной стратегией", "В игре нельзя определить цель", "В игре действия не приводят к новым состояниям"], "ans": 1, "ex": "В поиске переходы зависят только от ваших действий. В игре результат зависит и от ответа другой стороны. Поэтому нужно учитывать не только свои ходы, но и то, как может поступить соперник."}, {"q": "Какой принцип оценки уместнее?", "opts": ["Minimax: считать, что соперник всегда играет наилучшим образом", "Expectimax: усреднить исходы по вероятностям ходов соперника", "Поиск в ширину: выбрать путь с меньшим числом ходов", "Любой из них: результат будет одинаковым"], "ans": 1, "ex": "Expectimax использует модель поведения соперника: в его узлах берётся ожидание по известным вероятностям. Minimax уместен, когда соперник играет сильно или его поведение неизвестно и нужна гарантия."}, {"q": "Что верно про альфа-бета отсечение по сравнению с полным minimax?", "opts": ["Оно даёт приближённый ответ, но работает быстрее", "Оно меняет результат, потому что пропускает часть ходов", "Оно возвращает тот же результат, если ветка доказуемо не влияет на выбор", "Оно применимо только к играм без соперника"], "ans": 2, "ex": "Альфа-бета — точное ускорение. Ветка отсекается только тогда, когда уже ясно: один из игроков не выберет её, потому что есть лучшая альтернатива. Значение minimax при этом не меняется."}, {"q": "Какое утверждение верно?", "opts": ["Глубина поиска всегда важнее качества оценки", "Качество оценки всегда важнее глубины поиска", "Это компромисс: полезны и глубина, и качество оценки", "Если есть minimax, оценка позиции не нужна"], "ans": 2, "ex": "Поиск и оценка дополняют друг друга. Глубокий просмотр помогает увидеть последствия ходов, а хорошая оценка важна там, где поиск остановился. При ограниченных ресурсах между ними приходится выбирать баланс."}, {"q": "Зачем в играх используют обучение оценки через самоигру?", "opts": ["Чтобы заменить правила игры статистикой", "Чтобы улучшать оценку позиций по опыту партий без готовых правильных ходов", "Чтобы всегда находить точное решение любой игры", "Чтобы избежать необходимости выбирать ходы"], "ans": 1, "ex": "В самоигре система получает опыт: позиции, ходы, исходы. По расхождению ожидания и результата она уточняет оценку состояний. Это не даёт точного решения для больших игр, но позволяет улучшать качество игры без размеченных примеров «правильного хода»."}, {"q": "Что произойдёт, если соперник заметит эту стратегию?", "opts": ["Вы получите преимущество, потому что стратегия простая", "Соперник сможет стабильно выигрывать, отвечая бумагой", "Результат не изменится: ходы равнозначны", "Нужно перейти к minimax по дереву ходов"], "ans": 1, "ex": "Чистая стратегия предсказуема. В одновременной игре соперник выбирает действие параллельно, но знание вашей привычки позволяет подготовить лучший ответ. Поэтому в таких играх часто используют смешивание."}, {"q": "Что описывает эта ситуация?", "opts": ["Оптимальный для всех исход, потому что он устойчив", "Равновесие Нэша: никому невыгодно менять стратегию в одиночку", "Ошибку minimax, потому что противник не рационален", "Случайность, которую нужно моделировать expectiminimax"], "ans": 1, "ex": "Это равновесие Нэша: при выбранных стратегиях ни один участник не улучшит результат, отклонившись один. Но устойчивость не означает, что исход лучший для группы — совместно выгодный вариант может быть недостижим без координации."}, {"q": "Какой вывод из занятии о играх наиболее полезен в практической работе?", "opts": ["Всегда моделировать ситуацию как игру с нулевой суммой", "Всегда выбирать самую осторожную стратегию", "Сначала уточнить игроков, ходы, информацию и предположения о поведении другой стороны", "Игровые модели применимы только к настольным играм"], "ans": 2, "ex": "Польза игровых моделей начинается с постановки: кто действует, что известно, как другая сторона может ответить и что считается успехом. От этих предположений зависит, нужен ли minimax, expectimax, смешанная стратегия или другой инструмент."}, {"q": "Что изображают узлы дерева игр в классической постановке?", "opts": ["Состояния мира и очередь того, кто должен ходить", "Только состояния, в которых агент может действовать", "Все возможные исходы броска кубика", "Позиции, достигнутые за один ход обоих игроков сразу"], "ans": 0, "ex": "Каждый узел — это состояние позиции, а корень и листья помечают, чей ход. Дерево растёт за счёт действий всех игроков, а не только нашего агента."}, {"q": "Как агент выбирает ход в узле максимума при обычном minimax?", "opts": ["Берёт действие с наименьшим значением", "Берёт действие с наибольшим значением, считая, что соперник ответит хуже для нас", "Берёт случайное действие с равной вероятностью", "Берёт действие, ведущее к самому глубокому узлу"], "ans": 1, "ex": "В узле максимума значение — это лучшее из того, что мы можем выжать, зная, что соперник в своём узле минимума минимизирует наше значение. Отсюда и название."}, {"q": "Почему отсечение альфа-бета не меняет итоговый выбор по сравнению с полным minimax?", "opts": ["Потому что оно пропускает только ветки с одинаковыми значениями", "Потому что отсекаемая ветка уже доказанно не может повлиять на решение предка", "Потому что оно заранее знает все значения листьев", "Потому что соперник никогда не выбирает худшие ходы"], "ans": 1, "ex": "Отсечение происходит, когда у предка уже есть альтернатива не хуже: агент не выберет худшую ветку, а соперник не даст в ней большего значения. Результат тот же, работы меньше."}, {"q": "Зачем нужна оценочная функция, если minimax даёт правильный ответ?", "opts": ["Чтобы ускорить поиск: дерево усекается, а оценка приближает листья", "Чтобы заменить соперника на модель соперника", "Чтобы считать вероятности исходов", "Чтобы избавиться от необходимости знать правила игры"], "ans": 0, "ex": "Полное дерево часто огромно, поэтому поиск обрезают на небольшой глубине и вместо настоящих листьев считают приближение. Цена скорости — погрешность: чем точнее оценка, тем ближе выбор к оптимуму."}, {"q": "От чего зависит, насколько сильно альфа-бета сокращает работу?", "opts": ["От порядка рассмотрения действий: сначала перспективные дают лучший эффект", "От размера оценочной функции", "От глубины рекурсии в языке программирования", "От числа игроков за доской"], "ans": 0, "ex": "При удачном порядке действий отсекается почти половина дерева (при оптимальном порядке — около корня числа листьев), при неудачном — почти ничего. Поэтому порядок перебора — часть алгоритма, а не деталь реализации."}, {"q": "Как expectimax обходится с узлами соперника?", "opts": ["Минимизирует значение, как minimax", "Берёт среднее значение по вероятностям ходов соперника", "Игнорирует эти узлы", "Возвращает ноль"], "ans": 1, "ex": "Expectimax модель не соперника, а его стратегии: считается, что ходы делаются с известными вероятностями, и значение узла — среднее. Это хорошо при предсказуемом сопернике и рискованно, если он играет иначе."}, {"q": "Что роднит узлы в MDP и узлы соперника в игре с шумом?", "opts": ["Оба минимизируют значение", "В обоих значение считается не выбором действия, а усреднением по исходам", "Оба не требуют модели среды", "В обоих агент выбирает ходы наугад"], "ans": 1, "ex": "И в MDP, и в узле шума (или соперника с вероятностной моделью) действие не выбирается максимумом: значение — это математическое ожидание по всем исходам. Меняется лишь то, чья это вероятность."}, {"q": "Как TD-обучение помогает в играх?", "opts": ["Обучает соперника играть за нас", "Обучает оценочную функцию по фактическим результатам партий, без размеченных примеров", "Ускоряет обход дерева вдвое", "Заменяет правила игры на вероятности"], "ans": 1, "ex": "TD-обучение правит значения позиций по ходу партии, подтягивая оценку предыдущих состояний к более поздним результатам. Размечать позиции руками не нужно — учит сама игра."}, {"q": "Зачем в смешанных стратегиях нужны случайные ходы, если можно выбрать лучший детерминированный?", "opts": ["Случайность упрощает реализацию", "Чтобы соперник не смог предсказывать и использовать ваши повторяющиеся ходы", "Чтобы игра заканчивалась быстрее", "Чтобы оценка позиции считалась точнее"], "ans": 1, "ex": "При детерминированной стратегии соперник подстраивается под ваши повторы. Смешанная стратегия в равновесии Нэша делает сопернику безразлично, что делать в ответ, — и именно она устойчива."}, {"q": "Какой вывод из занятии по играм относится и к реальным системам?", "opts": ["Мир всегда играет за нас", "Модель противника и оценка позиции — допущения, а не факты: их нужно проверять в работе", "Достаточно увеличить глубину поиска", "Случайность всегда вредна"], "ans": 1, "ex": "Все ускорения и модели — это допущения: как играет соперник, насколько точна оценка, соблюдаются ли вероятности. Занятие заканчивается тем, что именно эти допущения и определяют, работает ли метод."}, {"q": "Что такое игра в теории игр?", "opts": ["Ситуация, где несколько участников выбирают действия", "Одна программа", "Вид файла", "Название сайта"], "ans": 0, "ex": "Игра — это модель взаимодействия: у каждого игрока есть выбор и результат."}, {"q": "Кто такой противник в игре?", "opts": ["Участник, чьи интересы могут не совпадать с вашими", "Тот, кто проиграл", "Компьютер всегда", "Случайное событие"], "ans": 0, "ex": "Противник выбирает свои ходы — его решение влияет на ваш исход."}, {"q": "Что такое ход?", "opts": ["Выбор действия игрока в своей позиции", "Конец игры", "Награда за победу", "Название стратегии"], "ans": 0, "ex": "Ход меняет состояние игры и ведёт к следующей позиции."}, {"q": "Что изображает
